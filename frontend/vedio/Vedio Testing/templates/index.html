<!DOCTYPE html>
<html>
<head>
  <title>Video LMS Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>AI-Powered Video LMS</h1>

  <div class="section">
    <h2>1. Upload Video</h2>
    <input type="file" id="videoFile" accept="video/*">
    <button onclick="uploadVideo()">Upload</button>
    <div id="uploadResult"></div>
  </div>

  <div class="section">
    <h2>2. Process Video</h2>
    <input type="text" id="videoId" placeholder="Paste video ID">
    <button onclick="processVideo()">Process</button>
    <div id="processResult"></div>
  </div>

  <div class="section">
    <h2>3. Ask a Question</h2>
    <input type="text" id="queryVideoId" placeholder="Video ID">
    <input type="text" id="question" placeholder="Type your question">
    <button onclick="queryVideo()">Ask</button>
    <div id="queryResult"></div>
  </div>

  <script>
    async function uploadVideo() {
      const file = document.getElementById('videoFile').files[0];
      if (!file) return alert("Choose a file");

      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch("/upload", { method: "POST", body: formData });
      const result = await response.json();

      document.getElementById('uploadResult').innerHTML = `
        <p>✅ Video uploaded!</p>
        <p><b>Video ID:</b> ${result.video_id}</p>
      `;

      document.getElementById("videoId").value = result.video_id;
      document.getElementById("queryVideoId").value = result.video_id;
    }

    async function processVideo() {
      const videoId = document.getElementById("videoId").value;
      if (!videoId) return alert("Video ID required");

      document.getElementById('processResult').innerHTML = '⏳ Processing...';

      const response = await fetch(`/process-video/${videoId}`, { method: "POST" });
      const result = await response.json();

      document.getElementById('processResult').innerHTML = `
        <p>✅ Processed! Found ${result.transcript.length} segments</p>
        ${result.transcript.slice(0, 3).map(t => `<p>${t.start}s: ${t.text}</p>`).join("")}
      `;
    }

    async function queryVideo() {
      const videoId = document.getElementById("queryVideoId").value;
      const question = document.getElementById("question").value;

      if (!videoId || !question) return alert("Both fields required");

      const response = await fetch("/query-video", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ video_id: videoId, question: question }),
      });

      const result = await response.json();

      document.getElementById("queryResult").innerHTML = `
        <p><b>Answer:</b> ${result.answer}</p>
        ${result.timestamp ? `<p>⏱️ Timestamp: ${result.timestamp}s</p>` : ""}
        <a href="${result.video_path}" target="_blank">▶️ Watch Video</a>
        <p><b>Context:</b> ${result.relevant_text}</p>
      `;
    }
  </script>
</body>
</html>
