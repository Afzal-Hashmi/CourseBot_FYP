version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: coursebot
      POSTGRES_PASSWORD: coursebotpass
      POSTGRES_DB: coursebotdb
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: coursebot-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://coursebot:coursebotpass@db:5432/coursebotdb
    depends_on:
      - db

volumes:
  postgres_data: 